[package]
name = "falcon-desktop"
version = "1.0.0"
description = "FALCON desktop app: the discovery engine and console in a native window"
edition = "2021"
authors = ["Team THETA172"]
license = "MIT"
rust-version = "1.80"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
