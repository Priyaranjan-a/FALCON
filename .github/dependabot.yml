version: 2
updates:
  - package-ecosystem: pip
    directory: /server
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ["dependencies", "server"]
    commit-message:
      prefix: "server"

  - package-ecosystem: npm
    directory: /console
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ["dependencies", "console"]
    commit-message:
      prefix: "console"
    groups:
      # The console's build and test tooling moves together.
      tooling:
        patterns: ["vite*", "@vitejs/*", "vitest", "typescript", "tailwindcss", "@tailwindcss/*"]

  - package-ecosystem: cargo
    directory: /desktop/src-tauri
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels: ["dependencies", "desktop"]
    commit-message:
      prefix: "desktop"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: ["dependencies", "ci"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    labels: ["dependencies", "docker"]
