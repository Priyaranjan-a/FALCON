<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FALCON</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f5f5f7;
        --ink: #1d1d1f;
        --ink-2: #6e6e73;
        --ink-3: #8e8e93;
        --line: rgba(0, 0, 0, 0.08);
        --button: rgba(118, 118, 128, 0.12);
        --button-hover: rgba(118, 118, 128, 0.2);
        --danger: #c20000;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1c1c1e;
          --ink: #f5f5f7;
          --ink-2: #a1a1a6;
          --ink-3: #8e8e93;
          --line: rgba(255, 255, 255, 0.09);
          --button: rgba(118, 118, 128, 0.24);
          --button-hover: rgba(118, 118, 128, 0.34);
          --danger: #ff6961;
        }
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        background: var(--bg);
        color: var(--ink);
        font: 13px/1.45 "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif;
        -webkit-font-smoothing: antialiased;
        user-select: none;
        cursor: default;
        overflow: hidden;
      }
      main {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 28px 32px 22px;
        text-align: center;
      }
      .mark { width: 76px; height: 76px; filter: drop-shadow(0 10px 24px rgba(0, 0, 0, 0.22)); animation: rise 520ms cubic-bezier(0.22, 1, 0.36, 1) both; }
      h1 { margin: 18px 0 2px; font-size: 17px; font-weight: 600; letter-spacing: 0.16em; }
      .tagline { color: var(--ink-2); }
      .status { margin-top: 26px; min-height: 40px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
      .status p { margin: 0; color: var(--ink-3); }
      .spinner { width: 18px; height: 18px; color: var(--ink-3); }
      .spinner rect { animation: spoke 1s linear infinite; }
      .error { display: none; max-width: 360px; }
      .error p { color: var(--danger); margin: 0 0 12px; user-select: text; }
      .actions { display: flex; gap: 8px; justify-content: center; }
      button {
        font: inherit;
        font-weight: 500;
        color: var(--ink);
        background: var(--button);
        border: 0;
        border-radius: 8px;
        height: 28px;
        padding: 0 12px;
      }
      button:hover { background: var(--button-hover); }
      button:focus-visible { outline: 2px solid #0071e3; outline-offset: 2px; }
      footer { margin-top: auto; color: var(--ink-3); font-size: 11px; }
      body.failed .progress { display: none; }
      body.failed .error { display: block; }
      @keyframes spoke { from { opacity: 1; } to { opacity: 0.15; } }
      @keyframes rise { from { opacity: 0; transform: translateY(6px) scale(0.96); } to { opacity: 1; transform: none; } }
      @media (prefers-reduced-motion: reduce) { .mark { animation: none; } }
    </style>
  </head>
  <body>
    <main>
      <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
        <defs>
          <linearGradient id="t" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a3a3f" /><stop offset="1" stop-color="#141416" /></linearGradient>
          <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff" /><stop offset="1" stop-color="#b9d4ff" /></linearGradient>
        </defs>
        <rect width="64" height="64" rx="14.5" fill="url(#t)" />
        <g fill="url(#g)">
          <path d="M13 15.5h38l-6.2 9.5H19.2z" />
          <path d="M20.6 29.5h22.8l-5.6 8.6H26.2z" />
          <path d="M27.6 42.6h8.8L32 49.4z" />
        </g>
      </svg>
      <h1>FALCON</h1>
      <div class="tagline">Enterprise Cryptographic Discovery</div>

      <div class="status" aria-live="polite">
        <div class="progress">
          <svg class="spinner" viewBox="0 0 24 24" role="status" aria-label="Starting">
            <g fill="currentColor"></g>
          </svg>
          <p id="message">Starting the discovery engine…</p>
        </div>
        <div class="error">
          <p id="error"></p>
          <div class="actions">
            <button type="button" id="logs">Show logs</button>
            <button type="button" id="retry">Try again</button>
            <button type="button" id="quit">Quit</button>
          </div>
        </div>
      </div>

      <footer id="version"></footer>
    </main>

    <script src="splash.js"></script>
  </body>
</html>
