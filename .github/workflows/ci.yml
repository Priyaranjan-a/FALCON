name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server:
    name: Server tests (Linux · OpenSSL 3.5)
    runs-on: ubuntu-latest
    # The same Debian base the FALCON container ships: Python 3.14 with OpenSSL 3.5.
    container: python:3.14-slim-trixie
    steps:
      - name: Install git
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends git ca-certificates
      - uses: actions/checkout@v7
      - name: Install the server
        working-directory: server
        run: pip install --root-user-action=ignore --no-cache-dir -e ".[dev]"
      - name: Run the tests
        working-directory: server
        run: python -m pytest -q

  console:
    name: Console (types · unit tests · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: console/package-lock.json
      - name: Install
        working-directory: console
        run: npm ci --no-audit --no-fund
      - name: Type-check
        working-directory: console
        run: npx tsc -b
      - name: Unit tests
        working-directory: console
        run: npx vitest run
      - name: Production build
        working-directory: console
        run: npm run build
