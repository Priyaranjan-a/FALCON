name: Bug report
description: Something in FALCON does not work as it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this.

        **Found a security vulnerability?** Please do not use this form — report it
        privately through [Security advisories](https://github.com/shriomverma100/FALCON/security/advisories/new).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what did FALCON do instead?
      placeholder: I exported a CycloneDX CBOM and the file was empty.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest sequence that shows the problem.
      placeholder: |
        1. Sign in as the demo admin
        2. Open Reports
        3. Click "CycloneDX 1.6 CBOM"
        4. The downloaded file contains nothing
    validations:
      required: true

  - type: dropdown
    id: how-run
    attributes:
      label: How are you running FALCON?
      options:
        - Web platform (scripts/start)
        - Docker
        - Windows desktop app
        - Command line (falcon scan)
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: From Settings → About FALCON, or `falcon --version`.
      placeholder: "1.0.0"
    validations:
      required: true

  - type: input
    id: platform
    attributes:
      label: Operating system
      placeholder: "Windows 11, Ubuntu 24.04, macOS 15…"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or error messages
      description: >-
        Anything from the terminal, or the browser console (F12). This is
        automatically formatted as code, so no backticks are needed.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I have searched the existing issues for this problem.
          required: true
        - label: This report contains no real keys, certificates or private data.
          required: true
